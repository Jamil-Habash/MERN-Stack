<body>
    <div id="root"></div>
    <script>
        async function getPokemon() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon/ditto');
                const data = await response.json();
                console.log(data);
            } catch(err) {
                console.log(err);
            }
        }
        
        getPokemon();
    </script>
